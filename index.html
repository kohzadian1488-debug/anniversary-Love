<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>برای تو ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>❤️</span>
        <span>💖</span>
        <span>💕</span>
    </div>


    <div class="container">

        <div id="welcome">

            <p class="small-text">
                برای کسی که...
            </p>

            <h1>
                قشنگ‌ترین اتفاق زندگی منه ❤️
            </h1>

            <p class="subtitle">
                یه چیز کوچیک برات آماده کردم...
            </p>

            <div class="heart" onclick="openVideo()">
                ♥
            </div>

            <p class="hint">
                لمسش کن ❤️
            </p>

        </div>


        <div id="videoPage">

            <h1>
                سالگرد عقدمون مبارک ❤️
            </h1>

            <p class="message">
                این چند دقیقه فقط برای توئه...
            </p>

            <video controls>
                <source src="video/anniversary.mp4" type="video/mp4">
                مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
            </video>

            <p class="bottomMessage">
                دوستت دارم ❤️
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
